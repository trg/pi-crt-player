; PlatformIO project for ESP32-2432S028R ("Cheap Yellow Display" / CYD).
; Pinout/build flags below are confirmed working hardware facts, reused from
; a prior sandbox project on the same board (2.8-in-lcd-display/current-conditions).
; See remote-control/README.md for setup/flash/monitor instructions.

[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs

; NOTE: the touch controller (XPT2046) is wired to its OWN SPI bus, separate
; from the display's — MOSI 32, MISO 39, SCK 25, CS 33, IRQ 36 — not sharing
; the display's MOSI 13 / MISO 12 / SCLK 14 as most CYD writeups (including
; this repo's own docs, previously) assume. TFT_eSPI's built-in touch support
; only handles a shared bus, so it silently reads nothing on this board.
; Fix: a dedicated XPT2046_Touchscreen instance on its own SPI (see main.cpp).
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    paulstoffregen/XPT2046_Touchscreen

build_flags =
    -DUSER_SETUP_LOADED=1
    ; Forces the display onto the HSPI hardware peripheral so the global SPI
    ; object (VSPI, hardcoded by the XPT2046_Touchscreen library) is free for
    ; the touch controller's separate bus with zero contention.
    -DUSE_HSPI_PORT=1
    -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
